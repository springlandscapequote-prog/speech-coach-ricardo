<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1f4d32">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ricardo's Speech Coach">
  <title>Ricardo's Speech Coach</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <p class="brand" data-i18n="appTitle">Ricardo's Speech Coach</p>
      <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Idioma">
        <button type="button" data-action="lang" data-lang="es" data-testid="lang-es" aria-pressed="true">Español</button>
        <button type="button" data-action="lang" data-lang="en" data-testid="lang-en" aria-pressed="false">English</button>
      </div>
    </div>
    <h1 id="page-title">Hoy</h1>
  </header>
  <main id="main">
    <section id="panel-today" data-panel="today"></section>
    <section id="panel-drill" data-panel="drill" hidden></section>
    <section id="panel-lessons" data-panel="lessons" hidden></section>
    <section id="panel-script" data-panel="script" hidden></section>
    <section id="panel-score" data-panel="score" hidden></section>
  </main>
  <nav class="tabbar" aria-label="Secciones">
    <button type="button" data-action="tab" data-tab="today" data-testid="tab-today" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <span data-i18n="tabToday">Hoy</span>
    </button>
    <button type="button" data-action="tab" data-tab="drill" data-testid="tab-drill" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v5l3 2M9 3h6"/></svg>
      <span data-i18n="tabDrill">Ejercicio</span>
    </button>
    <button type="button" data-action="tab" data-tab="lessons" data-testid="tab-lessons" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5A2.5 2.5 0 0 1 6.5 8H20"/></svg>
      <span data-i18n="tabLessons">Lecciones</span>
    </button>
    <button type="button" data-action="tab" data-tab="script" data-testid="tab-script" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l6 3-6 3z" fill="currentColor" stroke="none"/></svg>
      <span data-i18n="tabScript">Guion</span>
    </button>
    <button type="button" data-action="tab" data-tab="score" data-testid="tab-score" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/><path d="M17 16l2 2 3-3"/></svg>
      <span data-i18n="tabScore">Puntaje</span>
    </button>
  </nav>

  <div id="prompter" class="prompter" data-testid="prompter" hidden>
    <div class="prompter-bar">
      <button type="button" data-action="prompter-close" data-testid="prompter-close" data-i18n="close">Cerrar</button>
      <button type="button" data-action="prompter-toggle" data-testid="prompter-play">Reproducir</button>
      <label><span data-i18n="speed">Velocidad</span> <input id="prompter-speed" data-testid="prompter-speed" type="range" min="12" max="180" value="48"> <span id="prompter-speed-value" data-testid="prompter-speed-value">48</span></label>
      <label><span data-i18n="textSize">Texto</span> <input id="prompter-font" data-testid="prompter-font" type="range" min="24" max="72" value="40"> <span id="prompter-font-value" data-testid="prompter-font-value">40</span></label>
    </div>
    <div id="prompter-scroll" class="prompter-scroll" data-testid="prompter-scroll" tabindex="0">
      <div id="prompter-text" class="prompter-text" lang="en" translate="no"></div>
    </div>
  </div>

  <div id="recorder" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="rec-title">
      <h2 id="rec-title" data-i18n="recTitle">Grabar</h2>
      <p class="fine" data-i18n="recPrivacy">Las grabaciones se quedan solo en este teléfono. No se sube nada.</p>
      <p id="rec-label"></p>
      <div class="row">
        <button type="button" class="btn primary" data-action="rec-start" data-testid="rec-start" data-i18n="recRecord">Grabar</button>
        <button type="button" class="btn primary" data-action="rec-stop" data-testid="rec-stop" data-i18n="recStop" hidden>Detener</button>
        <button type="button" class="btn ghost" data-action="close-recorder" data-i18n="close">Cerrar</button>
      </div>
      <p id="rec-status" role="status"></p>
      <audio id="rec-audio" controls hidden></audio>
      <ul id="rec-list"></ul>
    </div>
  </div>
  <div id="toast" class="toast" hidden role="status"></div>
  <noscript><p class="noscript">Ricardo's Speech Coach needs JavaScript. Esta aplicación necesita JavaScript. Nothing is uploaded. No se sube nada.</p></noscript>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
